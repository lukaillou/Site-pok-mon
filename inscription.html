<!DOCTYPE html>
<html lang="en" class="has-background-dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bulma.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="icon" href="favicon.ico">
    <title>Mon Pokédex</title>
</head>

<body>
    <section class="hero is-justify-content-center has-background-dark">
        <div class="hero-body container is-fluid">
            <div class="box has-background-danger-45">

                <section class="is-flex is-justify-content-start">
                    <div class="box has-background-danger-20 m-4"></div>
                    <div class="box has-background-danger-20 m-4"></div>
                </section>

                <div class="box has-background-black is-justify-content-center">
                    <form action="collection.html" class="box has-background-text-80">
                        <div class="field">
                            <label class="label has-text-black">Adresse mail</label>
                            <div class="control">
                                <input class="input is-rounded has-background-white" type="email"
                                    placeholder="Adresse mail" />
                            </div>
                        </div>

                        <div class="field">
                            <label class="label has-text-black">Nom d'utilisateur</label>
                            <div class="control">
                                <input class="input is-rounded has-background-white" type="text"
                                    placeholder="Nom d'utilisateur" />
                            </div>
                        </div>

                        <div class="field">
                            <label class="label has-text-black">Mot de passe</label>
                            <div class="control">
                                <input class="input is-rounded has-background-white" type="password"
                                    placeholder="********" />
                            </div>
                        </div>

                        <div class="field">
                            <label class="label has-text-black">Confirmer</label>
                            <div class="control">
                                <input class="input is-rounded has-background-white" type="submit"
                                    placeholder="Confirmer" />
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
